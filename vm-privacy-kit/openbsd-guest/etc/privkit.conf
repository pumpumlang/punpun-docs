# /etc/privkit.conf -- settings for privctl (sourced by /bin/ksh)

# Internal LAN to the Debian services VM. The NIC is found by the MAC the host
# script set (08:00:27:77:00:01). Set LAN_IF=em1 to override.
LAN_MAC="08:00:27:77:00:01"
LAN_IF=""
LAN_ADDR="10.77.0.1"
LAN_NET="10.77.0.0/24"
SERVICES_IP="10.77.0.2"           # Pi-hole + SearXNG VM

# VirtualBox NAT adapter. Empty = auto (the interface holding 10.0.2.x).
NAT_IF=""

# SSH administration through the VirtualBox NAT port-forward
# (host 127.0.0.1:2221 -> guest 22). Connections arrive from 10.0.2.2.
ADMIN_SSH_FROM="10.0.2.2"
ADMIN_SSH_PORT="22"

# Resolver while a lock is on: Pi-hole if it answers, otherwise the DNS
# server from your Mullvad config (lock mullvad) -- never the NAT's resolver.
PIHOLE_DNS="10.77.0.2"

# Ports of the Hysteria listeners the services VM may reach (see config.yaml).
LAN_PROXY_PORTS="1080 8080 5353"

# pf port spec for the Hysteria server. Empty = derived from `server:` in
# /etc/hysteria/config.yaml (single port or one "a-b" hopping range).
SERVER_PF_PORTS=""

# Seconds before an unconfirmed `privctl lock ...` reverts to open mode.
CONFIRM_TIMEOUT="180"

# Checks used by `privctl mullvad test` and `privctl hy2 test`.
MULLVAD_CHECK_URL="https://am.i.mullvad.net/connected"
HY2_TEST_URL="https://cdn.openbsd.org/pub/OpenBSD/7.9/SHA256"
TEST_DNS_NAME="openbsd.org"
