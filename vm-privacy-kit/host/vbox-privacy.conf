# vbox-privacy.conf -- defaults for vbox-privacy-setup.sh
#
# This file is sourced by bash. Edit values here, or override any of them from
# the environment for one run, e.g.:
#     OPENBSD_MEMORY_MB=3072 ./vbox-privacy-setup.sh create-openbsd
#
# Nothing in this file refers to your existing Parrot VM. The Parrot VM folder
# is listed in PROTECTED_PATHS only so the script refuses to touch it.

# ---------------------------------------------------------------- protection
# Paths that must never be created, modified, attached or deleted. The script
# aborts if any path it would use is inside one of these.
PROTECTED_PATHS=(
  "/home/vynar/VirtualBox VMs/Parrot OS 7.3 KDE Security Edition"
)

# ---------------------------------------------------------------- locations
# Folder that holds VirtualBox machine folders (VirtualBox's default).
VM_BASEFOLDER="${VM_BASEFOLDER:-$HOME/VirtualBox VMs}"
# Where verified installer images are cached. Rerunning reuses them.
CACHE_DIR="${CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/vbox-privacy-kit}"

# ---------------------------------------------------------------- OpenBSD VM
# 7.9 is the current release (released 2026-05-19). When 8.0 ships, set
# OPENBSD_VERSION=8.0 -- the file names are derived from it (install80.iso).
OPENBSD_VERSION="${OPENBSD_VERSION:-7.9}"
OPENBSD_ARCH="amd64"
# Two official hosts. SHA256 files from both must agree before the ISO is used.
OPENBSD_MIRROR="${OPENBSD_MIRROR:-https://cdn.openbsd.org/pub/OpenBSD}"
OPENBSD_MIRROR2="${OPENBSD_MIRROR2:-https://ftp.openbsd.org/pub/OpenBSD}"
# Optional: signify public key for an extra signature check, e.g. from the
# Debian/Ubuntu package signify-openbsd-keys. Auto-detected when empty.
OPENBSD_SIGNIFY_PUBKEY="${OPENBSD_SIGNIFY_PUBKEY:-}"

OPENBSD_VM_NAME="${OPENBSD_VM_NAME:-OpenBSD-${OPENBSD_VERSION}-Privacy}"
OPENBSD_MEMORY_MB="${OPENBSD_MEMORY_MB:-2048}"   # >=2048 so Go can build Hysteria in the guest
OPENBSD_CPUS="${OPENBSD_CPUS:-2}"
OPENBSD_DISK_MB="${OPENBSD_DISK_MB:-24576}"      # dynamically allocated VDI
# SSH administration: host 127.0.0.1:<port>  ->  guest port 22 (NAT adapter 1)
OPENBSD_SSH_HOST_PORT="${OPENBSD_SSH_HOST_PORT:-2221}"
# MAC of the internal-network adapter; the guest scripts find their LAN NIC by it.
OPENBSD_LAN_MAC="${OPENBSD_LAN_MAC:-080027770001}"

# ---------------------------------------------------------------- services VM
# Debian stable netinst for the Pi-hole + SearXNG companion VM. The newest
# netinst ISO name is read from the official SHA512SUMS at run time.
DEBIAN_ISO_BASE="${DEBIAN_ISO_BASE:-https://cdimage.debian.org/debian-cd/current/amd64/iso-cd}"
# Debian CD signing key (used only if gpg has it; see README).
DEBIAN_CD_KEY_FPR="DF9B9C49EAA9298432589D76DA87E80D6294BE9B"

SERVICES_VM_NAME="${SERVICES_VM_NAME:-Debian-PiHole-SearXNG}"
SERVICES_MEMORY_MB="${SERVICES_MEMORY_MB:-2048}"
SERVICES_CPUS="${SERVICES_CPUS:-1}"
SERVICES_DISK_MB="${SERVICES_DISK_MB:-16384}"
SERVICES_SSH_HOST_PORT="${SERVICES_SSH_HOST_PORT:-2222}"
SERVICES_LAN_MAC="${SERVICES_LAN_MAC:-080027770002}"
# NAT adapter cable of the services VM at creation. "off" (default): the VM is
# installed and runs ONLY through the OpenBSD VM (-> Mullvad). "on": it also
# has its own direct Internet path (direct mode; not private).
SERVICES_NAT_CABLE="${SERVICES_NAT_CABLE:-off}"

# ---------------------------------------------------------------- networking
# VirtualBox internal network shared ONLY by the two VMs above
# (OpenBSD 10.77.0.1  <->  Debian services 10.77.0.2). The host is not on it.
LAN_INTNET="${LAN_INTNET:-privacykit-lan}"
